<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Friend Manager for Facebook</title>
<style>
:root{--bg:#eef3fb;--bg2:#d9e6fb;--card:#fff;--tx:#14213d;--mut:#5d6b85;--bd:#dde5f2;--pri:#1877f2;--pri2:#0b5bd3;--ok:#1b9e5a;--bad:#e5484d;--soft:#f4f7fc;--sh:0 1px 2px rgba(20,40,90,.06),0 10px 28px -14px rgba(20,40,90,.25)}
:root[data-theme=dark]{--bg:#0e1420;--bg2:#13284d;--card:#172033;--tx:#e8eefb;--mut:#93a1bd;--bd:#26324a;--soft:#1c2740;--sh:0 10px 28px -14px rgba(0,0,0,.6)}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--tx);background:radial-gradient(1100px 480px at 8% -8%,var(--bg2),transparent),var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;padding:4px 10px 16px}
.logo b{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3b95ff,#0b5bd3);display:grid;place-items:center;color:#fff;font-size:20px}
.nv{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border:0;border-radius:12px;background:none;color:var(--mut);text-align:left;transition:background .15s,color .15s}
.nv:hover{background:var(--soft);color:var(--tx)}.nv.on{background:var(--pri);color:#fff}
.sp{flex:1}
.main{padding:28px;max-width:1040px;width:100%;margin:0 auto}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}h2{font-size:17px;margin:0 0 10px}.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);transition:transform .15s}
.st:hover{transform:translateY(-2px)}.st .v{font-size:30px;font-weight:700;line-height:1.1}.st .l{color:var(--mut);font-size:13px;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.bar{display:grid;grid-template-columns:130px 1fr 36px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.bar i{display:block;height:12px;border-radius:99px;background:var(--c);min-width:3px;transition:width .5s}.bar div{background:var(--soft);border-radius:99px}
.btn{border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:600;transition:transform .1s,background .15s;display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn[disabled]{opacity:.5;cursor:not-allowed}
.fb{font-size:17px;padding:14px 22px;border-radius:12px;width:100%;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}.row .grow{flex:1;color:var(--mut)}
.tb{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
input[type=search],input[type=text],select{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--soft);min-width:0}
input[type=search]{flex:1 1 200px}
.it{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--bd);cursor:pointer}.it:last-child{border:0}
.it:hover{background:var(--soft)}.it input{width:18px;height:18px;accent-color:var(--pri)}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#6aa9ff,#1877f2);color:#fff;display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}
.nm{flex:1;min-width:0}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--mut)}
.bd{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}
.pt{font-size:12px;color:var(--ok);font-weight:600}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}.empty svg.i{width:46px;height:46px;color:var(--pri);margin-bottom:8px}.empty h2{color:var(--tx)}
.warn{background:color-mix(in srgb,#f2a516 16%,transparent);border:1px solid #f2a516;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:14px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{max-width:440px;width:100%;padding:30px;text-align:center}
.login .logo{justify-content:center;font-size:22px}.login p{color:var(--mut)}
code{background:var(--soft);padding:2px 6px;border-radius:6px;word-break:break-all;font-size:13px}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}ol,ul{padding-left:20px}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.bnav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0}.bnav button.on{color:var(--pri)}
#modal{position:fixed;inset:0;background:rgba(5,10,25,.55);display:grid;place-items:center;padding:16px;z-index:50}#modal[hidden]{display:none}
.mb{background:var(--card);border-radius:18px;padding:20px;max-width:480px;width:100%;max-height:85vh;display:flex;flex-direction:column;animation:pop .18s}
.mbody{overflow:auto;margin:8px 0}.mf{display:flex;gap:8px;justify-content:flex-end}.mb h3{margin:0}
@keyframes pop{from{transform:scale(.95);opacity:0}}
#toasts{position:fixed;top:16px;right:16px;display:grid;gap:8px;z-index:60}
.toast{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--sh);animation:pop .2s;max-width:320px}.toast.err{background:var(--bad);color:#fff}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--bd);border-top-color:var(--pri);animation:sp .8s linear infinite;margin:30px auto}@keyframes sp{to{transform:rotate(360deg)}}
.stick{position:sticky;bottom:78px}
@media(min-width:801px){.stick{bottom:12px}}
@media(max-width:800px){.app{display:block}.side{display:none}.bnav{display:flex}.main{padding:18px 14px 96px}.bar{grid-template-columns:100px 1fr 30px}#toasts{left:12px;right:12px;top:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="modal" hidden></div><div id="toasts" aria-live="polite"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const API="https://graph.facebook.com/v21.0";
const IC={home:"M3 11l9-8 9 8M5 10v10h14V10",users:"M9 11a4 4 0 100-8 4 4 0 000 8zM2 21v-1a6 6 0 0112 0v1M16 3.5a4 4 0 010 7.5M22 21v-1a6 6 0 00-4-5.6",bolt:"M13 2L4 14h7l-1 8 9-12h-7z",trend:"M3 17l6-6 4 4 8-8M15 7h6v6",shield:"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z",trash:"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13",swap:"M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7",gear:"M12 15a3 3 0 100-6 3 3 0 000 6zM19 12l2-1-2-4-2 1-2-1V5h-4v2l-2 1-2-1-2 4 2 1v2l-2 1 2 4 2-1 2 1v2h4v-2l2-1 2 1 2-4-2-1z",moon:"M20 14A8 8 0 1110 4a7 7 0 0010 10z",more:"M5 12h.01M12 12h.01M19 12h.01",star:"M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.2 6.5 20.2l1-6.2L3 9.6l6.2-.9z",eye:"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 100-6 3 3 0 000 6z"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const CATS=[["Very Active","#1b9e5a"],["Active","#2f80ed"],["Moderately Active","#7c5cff"],["Low Activity","#d98e04"],["Inactive","#e5484d"],["Unknown Activity","#8a94a6"]];
const PAGES=[["dashboard","Dashboard","home"],["all","All Friends","users"],["active","Active Friends","bolt"],["ranking","Inactive Ranking","trend"],["keep","Keep Friends","shield"],["cleanup","Cleanup Manager","trash"],["io","Import / Export","swap"],["settings","Settings","gear"]];
const S={friends:LS.get("fm.friends",[]),prot:new Set(LS.get("fm.prot",[])),sel:new Set(),queue:LS.get("fm.queue",[]),
 prefs:Object.assign({theme:"auto",appId:"1081867268152341",q:"",status:"all",sort:"az"},LS.get("fm.prefs",{})),
 user:null,page:"login",loading:false,kq:"",vis:[],guest:false};
const save=()=>{LS.set("fm.friends",S.friends);LS.set("fm.prot",[...S.prot]);LS.set("fm.queue",S.queue);LS.set("fm.prefs",S.prefs)};
const tok=()=>{try{return sessionStorage.getItem("fm.tok")}catch{return null}};
const redirectUri=()=>location.origin+location.pathname;
const catOf=f=>{if(!f.last)return 5;const d=(Date.now()-f.last)/864e5;return d<=7?0:d<=30?1:d<=90?2:d<=180?3:4};
const byId=id=>S.friends.find(f=>f.id===id);
function toast(m,err){const t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=m;$("#toasts").append(t);setTimeout(()=>t.remove(),4200)}
function modal(title,body,ok,cb,okClass){const m=$("#modal");m.innerHTML=`<div class="mb" role="dialog" aria-modal="true"><h3>${title}</h3><div class="mbody">${body}</div><div class="mf"><button class="btn" data-act="mclose">${ok?"Cancel":"Close"}</button>${ok?`<button class="btn ${okClass||"pri"}" data-act="mok">${ok}</button>`:""}</div></div>`;m.hidden=false;S.mcb=cb}
const closeModal=()=>{$("#modal").hidden=true;S.mcb=null};
function theme(){const t=S.prefs.theme==="auto"?(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):S.prefs.theme;document.documentElement.dataset.theme=t}
function go(p){if(p!=="login"&&!(S.user||S.guest||S.friends.length)&&p!=="settings"&&p!=="io"){S.page="login"}else S.page=p;render();scrollTo(0,0)}

/* ---------- Facebook OAuth (implicit flow, state-validated) ---------- */
function connect(){
 const id=S.prefs.appId.trim();
 if(!/^\d{8,20}$/.test(id))return toast("Enter a valid numeric App ID in Settings.",true);
 if(location.protocol==="file:")return toast("Facebook login needs http(s) hosting, not a local file. Use GitHub Pages or localhost.",true);
 const a=new Uint8Array(16);crypto.getRandomValues(a);const state=[...a].map(b=>b.toString(16).padStart(2,"0")).join("");
 try{sessionStorage.setItem("fm.state",state)}catch{return toast("Browser storage is blocked; OAuth state cannot be saved.",true)}
 location.href="https://www.facebook.com/v21.0/dialog/oauth?"+new URLSearchParams({client_id:id,redirect_uri:redirectUri(),state,response_type:"token",scope:"public_profile,user_friends"});
}
function handleCallback(){
 const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);
 const has=h.has("access_token")||h.has("error")||q.has("error")||q.has("error_reason");
 if(!has)return false;
 const p=h.has("access_token")||h.has("error")?h:q;
 let exp="";try{exp=sessionStorage.getItem("fm.state")||"";sessionStorage.removeItem("fm.state")}catch{}
 history.replaceState(null,"",location.pathname);
 if(!exp||p.get("state")!==exp){toast("Login rejected: security state did not match. Please try again.",true);return true}
 if(p.get("error")){toast("Facebook login cancelled or denied: "+(p.get("error_description")||p.get("error")).replace(/\+/g," "),true);return true}
 try{sessionStorage.setItem("fm.tok",p.get("access_token"))}catch{}
 return "ok";
}
async function gx(url){
 const r=await fetch(url.startsWith("http")?url:API+url+(url.includes("?")?"&":"?")+"access_token="+encodeURIComponent(tok()));
 let j={};try{j=await r.json()}catch{}
 if(!r.ok||j.error){const e=new Error(j.error?.message||"HTTP "+r.status);e.code=j.error?.code;throw e}
 return j;
}
async function sync(){
 if(!tok())return toast("Not connected. Use Continue with Facebook.",true);
 S.loading=true;render();
 try{
  S.user=await gx("/me?fields=name,picture.type(large)");
  const old=new Map(S.friends.map(f=>[f.name.toLowerCase(),f]));let url="/me/friends?fields=name,picture.type(normal)&limit=100",got=[],n=0;
  while(url&&n++<30){const j=await gx(url);got.push(...(j.data||[]));url=j.paging?.next||null}
  const keep=S.friends.filter(f=>f.src!=="api");
  const keys=new Set(keep.map(f=>f.name.toLowerCase()));
  got.forEach(g=>{const o=old.get(g.name.toLowerCase());if(keys.has(g.name.toLowerCase())){const k=keep.find(f=>f.name.toLowerCase()===g.name.toLowerCase());k.pic=g.picture?.data?.url||k.pic;return}
   keep.push({id:"fb:"+g.id,name:g.name,pic:g.picture?.data?.url||"",last:o?.last||null,src:"api"})});
  S.friends=keep;save();
  toast(got.length?`Loaded ${got.length} friends from Facebook.`:"Connected, but Facebook returned no friends. See Settings for why.");
 }catch(e){
  if(e.code===190){logout(true);toast("Your Facebook session expired. Please reconnect.",true)}
  else toast("Facebook API error: "+e.message,true);
 }
 S.loading=false;S.page=S.page==="login"?"dashboard":S.page;render();
}
function logout(silent){try{sessionStorage.removeItem("fm.tok")}catch{}S.user=null;S.friends=S.friends.filter(f=>f.src!=="api");S.guest=false;save();S.page="login";if(!silent){toast("Logged out. Facebook-sourced friends were cleared from this device.");render()}}

/* ---------- Import / export ---------- */
const fixName=n=>{try{return decodeURIComponent(escape(n))}catch{return n}};
const toTime=v=>{if(v==null||v==="")return null;const n=Number(v);const t=isNaN(n)?Date.parse(v):(n<1e11?n*1000:n);return isNaN(t)?null:t};
function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";rows.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()))}
function parseFile(text,fname){
 let items=[];
 if(/\.json$/i.test(fname)||/^\s*[\[{]/.test(text)){
  const j=JSON.parse(text);
  const arr=Array.isArray(j)?j:j.friends_v2||j.friends||j.data||Object.values(j).find(Array.isArray)||[];
  items=arr.map(x=>typeof x==="string"?{name:x}:{name:x.name||x.full_name,last:toTime(x.last_interaction??x.lastInteraction??x.last_active??x.lastActive)});
 }else{
  const rows=parseCSV(text),h=rows.shift().map(s=>s.trim().toLowerCase());
  const ni=h.findIndex(x=>x.includes("name")),li=h.findIndex(x=>/last|interaction|active/.test(x));
  if(ni<0)throw new Error("CSV needs a header row with a Name column.");
  items=rows.map(r=>({name:r[ni],last:li>=0?toTime(r[li]):null}));
 }
 return items.filter(x=>x.name&&String(x.name).trim()).map(x=>({name:fixName(String(x.name).trim()),last:x.last||null}));
}
function importText(text,fname){
 try{
  const items=parseFile(text,fname);if(!items.length)throw new Error("No friend names found in this file.");
  const map=new Map(S.friends.map(f=>[f.name.toLowerCase(),f]));let add=0,upd=0;
  items.forEach(it=>{const k=it.name.toLowerCase(),f=map.get(k);if(f){if(it.last){f.last=it.last;upd++}}else{const n={id:"im:"+k,name:it.name,pic:"",last:it.last,src:"file"};S.friends.push(n);map.set(k,n);add++}});
  save();toast(`Imported ${add} new friends, updated activity for ${upd}.`);render();
 }catch(e){toast("Import failed: "+e.message,true)}
}
function csvCell(v){let s=String(v??"");if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(list,name){
 if(!list.length)return toast("Nothing to export.",true);
 const rows=[["Name","Activity","Last interaction","Protected","Source"],...list.map(f=>[f.name,CATS[catOf(f)][0],f.last?new Date(f.last).toISOString().slice(0,10):"",S.prot.has(f.id)?"yes":"no",f.src==="api"?"Facebook API":"Imported file"])];
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(csvCell).join(",")).join("\n")],{type:"text/csv"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Exported "+list.length+" friends.");
}

/* ---------- Views ---------- */
const stat=(l,v,i,c)=>`<div class="st"><div class="l" style="color:${c}">${ic(i)}<span style="color:var(--mut)">${l}</span></div><div class="v">${v}</div></div>`;
const empty=(t,m)=>`<div class="empty">${ic("users")}<h2>${t}</h2><p>${m}</p><div class="row" style="justify-content:center"><button class="btn pri" data-act="nav" data-id="io">Import friends file</button><button class="btn" data-act="connect">Connect Facebook</button></div></div>`;
function loginView(){
 return `<div class="login"><div class="card"><div class="logo"><b>f</b>Friend Manager</div><h1>Review your friends list</h1><p>Sign in with Facebook&rsquo;s official login. Your password is never seen by this app.</p>
 ${location.protocol==="file:"?`<div class="warn">You opened this as a local file. Facebook login only works from a hosted address such as GitHub Pages or <code>http://localhost</code>.</div>`:""}
 <button class="btn pri fb" data-act="connect">Continue with Facebook</button>
 <p style="font-size:13px">Or <a href="#" data-act="guest">work from an exported file only</a> &mdash; no login needed.</p>
 <p style="font-size:12px">Redirect URI to register in Meta: <code>${esc(redirectUri())}</code></p><button class="btn" data-act="theme" style="margin-top:6px">${ic("moon")} Theme</button></div></div>`;
}
function dashView(){
 const F=S.friends,c=CATS.map((_,i)=>F.filter(f=>catOf(f)===i).length),max=Math.max(1,...c);
 const act=c[0]+c[1]+c[2],review=F.filter(f=>catOf(f)>=3&&catOf(f)<5&&!S.prot.has(f.id)).length;
 return `<h1>${S.user?"Hi, "+esc(S.user.name.split(" ")[0]):"Dashboard"}</h1><p class="sub">Activity is only as good as the data you provide. Friends without it stay Unknown.</p>
 ${S.user?`<div class="card row" style="margin-bottom:16px"><span class="av">${S.user.picture?.data?.url?`<img src="${esc(S.user.picture.data.url)}" alt="">`:esc(S.user.name[0])}</span><span class="grow"><b style="color:var(--tx)">${esc(S.user.name)}</b><br>Connected to Facebook</span><button class="btn" data-act="sync">Refresh</button></div>`:""}
 <div class="grid">${stat("Total friends",F.length,"users","var(--pri)")}${stat("Active",act,"bolt","var(--ok)")}${stat("Inactive",c[4],"trend","var(--bad)")}${stat("Selected",S.sel.size,"star","#7c5cff")}${stat("To review",review,"eye","#d98e04")}</div>
 <div class="card"><h2>Activity overview</h2>${F.length?CATS.map((k,i)=>`<div class="bar"><span>${k[0]}</span><div><i style="--c:${k[1]};width:${c[i]/max*100}%"></i></div><b>${c[i]}</b></div>`).join(""):empty("No friends loaded yet","Connect Facebook or import your own friends file to begin.")}</div>`;
}
function listPage(p){
 const titles={all:["All Friends","Everyone available from the API or your imported file."],active:["Active Friends","Very Active, Active and Moderately Active, based on last interaction dates you imported."],ranking:["Inactive Ranking","Sorted from least to most active. Unknown means no data, not inactive."],cleanup:["Cleanup Manager","Choose friends to review. Protected friends never appear here."]};
 const pr=S.prefs;
 if(!S.friends.length)return `<h1>${titles[p][0]}</h1>`+`<div class="card">${empty("No friend data yet","Facebook only shares friends who also use this app. You can also import your own export.")}</div>`;
 return `<h1>${titles[p][0]}</h1><p class="sub">${titles[p][1]}</p>
 ${S.queue.length&&p==="cleanup"?queueView():""}
 <div class="card tb"><input type="search" id="q" placeholder="Search by name" aria-label="Search friends" value="${esc(pr.q)}">
 <select id="status" aria-label="Filter"><option value="all">All activity</option>${CATS.map((k,i)=>`<option value="${i}"${pr.status==i?" selected":""}>${k[0]}</option>`).join("")}</select>
 <select id="sort" aria-label="Sort">${[["az","Name A–Z"],["za","Name Z–A"],["most","Most active first"],["least","Least active first"]].map(o=>`<option value="${o[0]}"${pr.sort===o[0]?" selected":""}>${o[1]}</option>`).join("")}</select></div>
 <div class="row"><span class="grow" id="cnt"></span><button class="btn" data-act="selAll">Select all</button><button class="btn" data-act="selNone">Deselect all</button>${p==="cleanup"?"":`<button class="btn" data-act="keepSel">${ic("shield")}Keep selected</button><button class="btn" data-act="toClean">Add to cleanup</button>`}</div>
 <div class="card" id="list" style="padding:6px 12px"></div>
 ${p==="cleanup"?`<div class="card row stick" style="margin:0"><span class="grow" id="cc"></span><button class="btn bad" data-act="review">Review &amp; confirm</button></div>`:""}`;
}
function baseList(){
 const p=S.page;let l=S.friends;
 if(p==="active")l=l.filter(f=>catOf(f)<=2);
 if(p==="cleanup")l=l.filter(f=>!S.prot.has(f.id));
 return l;
}
function paintList(){
 const el=$("#list");if(!el)return;
 const pr=S.prefs,q=pr.q.trim().toLowerCase();
 let l=baseList().filter(f=>(!q||f.name.toLowerCase().includes(q))&&(pr.status==="all"||catOf(f)==pr.status));
 const rk=f=>f.last?f.last:-1;
 l.sort((a,b)=>pr.sort==="az"?a.name.localeCompare(b.name):pr.sort==="za"?b.name.localeCompare(a.name):pr.sort==="most"?rk(b)-rk(a):rk(a)-rk(b));
 S.vis=l.map(f=>f.id);
 el.innerHTML=l.length?l.slice(0,400).map(f=>{const c=CATS[catOf(f)];return `<label class="it"><input type="checkbox" class="chk" data-id="${esc(f.id)}"${S.sel.has(f.id)?" checked":""}><span class="av">${f.pic?`<img src="${esc(f.pic)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:esc(f.name[0]||"?")}</span><span class="nm"><b>${esc(f.name)}</b><small>${f.last?"Last interaction "+new Date(f.last).toLocaleDateString():"No activity data"} &middot; ${f.src==="api"?"Facebook":"File"}</small></span>${S.prot.has(f.id)?'<span class="pt">Protected</span>':""}<span class="bd" style="--c:${c[1]}">${c[0]}</span></label>`}).join("")+(l.length>400?`<p class="empty">Showing 400 of ${l.length}. Narrow your search.</p>`:""):`<div class="empty">${ic("users")}<h2>No matches</h2><p>Try a different search or filter.</p></div>`;
 count();
}
function count(){
 const sel=[...S.sel].filter(id=>byId(id));const e=$("#cnt");if(e)e.textContent=`${S.vis.length} shown · ${sel.length} selected`;
 const c=$("#cc");if(c)c.textContent=`${sel.filter(id=>!S.prot.has(id)).length} friends selected for cleanup`;
}
function keepView(){
 const P=S.friends.filter(f=>S.prot.has(f.id));
 return `<h1>Keep Friends</h1><p class="sub">Protected friends are excluded from every cleanup selection.</p>
 <div class="card"><h2>Find someone to protect</h2><div class="tb" style="padding:0"><input type="search" id="kq" placeholder="Search by name" value="${esc(S.kq)}" aria-label="Search friends to protect"></div><div id="kres"></div></div>
 <div class="card"><h2>Protected (${P.length})</h2>${P.length?P.map(f=>`<div class="it"><span class="av">${f.pic?`<img src="${esc(f.pic)}" alt="" referrerpolicy="no-referrer">`:esc(f.name[0])}</span><span class="nm"><b>${esc(f.name)}</b></span><button class="btn" data-act="unkeep" data-id="${esc(f.id)}">Remove</button></div>`).join(""):`<div class="empty">${ic("shield")}<h2>Nobody protected yet</h2><p>Search above, or select friends on the All Friends page and choose Keep selected.</p></div>`}</div>`;
}
function paintKeep(){
 const e=$("#kres");if(!e)return;const q=S.kq.trim().toLowerCase();
 if(!q){e.innerHTML="";return}
 const r=S.friends.filter(f=>!S.prot.has(f.id)&&f.name.toLowerCase().includes(q)).slice(0,15);
 e.innerHTML=r.length?r.map(f=>`<div class="it"><span class="av">${f.pic?`<img src="${esc(f.pic)}" alt="" referrerpolicy="no-referrer">`:esc(f.name[0])}</span><span class="nm"><b>${esc(f.name)}</b></span><button class="btn pri" data-act="keep" data-id="${esc(f.id)}">Keep</button></div>`).join(""):`<p class="sub" style="margin:12px 0 0">No unprotected friend matches.</p>`;
}
function queueView(){
 return `<div class="card"><h2>Guided removal (${S.queue.length} left)</h2><ol><li>Open Facebook using the link beside a name.</li><li>Go to their profile, choose Friends, then Unfriend.</li><li>Come back and press Done to remove them from this list.</li></ol>
 <p class="sub">Facebook offers no tool for removing friends in bulk, so each removal is done by you on facebook.com.</p>
 ${S.queue.map(id=>{const f=byId(id);return f?`<div class="it"><span class="nm"><b>${esc(f.name)}</b></span><a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.facebook.com/search/people/?q=${encodeURIComponent(f.name)}">Find on Facebook</a><button class="btn pri" data-act="done" data-id="${esc(id)}">Done</button></div>`:""}).join("")}
 <div class="row" style="margin-top:12px"><a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.facebook.com/friends/list">Open my Friends list</a><button class="btn" data-act="cancelQ">Cancel guide</button></div></div>`;
}
function ioView(){
 return `<h1>Import / Export</h1><p class="sub">Everything stays in this browser.</p>
 <div class="card"><h2>Import friends</h2><p>Use a JSON or CSV file. Facebook&rsquo;s own export (Settings &rarr; Accounts Center &rarr; Your information &rarr; Download your information &rarr; Friends and followers, JSON format) lists names only. Its timestamps are when you became friends, not activity.</p>
 <p>To rank activity, add a <code>last_interaction</code> column or field with a date, from your own records.</p><input type="file" id="file" accept=".json,.csv,text/csv,application/json" hidden><button class="btn pri" data-act="pick">${ic("swap")} Choose file</button></div>
 <div class="card"><h2>Export</h2><div class="row"><button class="btn" data-act="expAll">All friends (CSV)</button><button class="btn" data-act="expSel">Selected (CSV)</button><button class="btn" data-act="expProt">Protected (CSV)</button></div></div>`;
}
function settingsView(){
 const p=S.prefs;
 return `<h1>Settings</h1><p class="sub">Preferences are saved on this device.</p>
 <div class="card"><h2>Appearance</h2><select id="themeSel" aria-label="Theme">${["auto","light","dark"].map(t=>`<option${p.theme===t?" selected":""}>${t}</option>`).join("")}</select></div>
 <div class="card"><h2>Facebook connection</h2><label>Meta App ID<br><input type="text" id="appId" value="${esc(p.appId)}" inputmode="numeric" style="width:100%;margin:6px 0"></label>
 <p>Redirect URI: <code>${esc(redirectUri())}</code></p>
 <div class="row"><button class="btn pri" data-act="connect">${S.user?"Reconnect":"Connect"}</button><button class="btn" data-act="logout">Log out</button><button class="btn bad" data-act="wipe">Erase local data</button></div></div>
 <div class="card"><h2>Meta setup</h2><details open><summary>Required app settings</summary><ol>
 <li>Open developers.facebook.com &rarr; My Apps &rarr; your app, and add the <b>Facebook Login</b> product.</li>
 <li>Facebook Login &rarr; Settings: turn on <b>Client OAuth Login</b> and <b>Web OAuth Login</b>.</li>
 <li>Add the redirect URI above to <b>Valid OAuth Redirect URIs</b>, exactly, including the trailing path.</li>
 <li>App settings &rarr; Basic: add your host (for example <code>username.github.io</code>) to App Domains and add a Website platform.</li>
 <li>In Development mode only people with an app role (admin, developer, tester) can log in. Add them under App roles.</li>
 <li>Permissions used: <code>public_profile</code> and <code>user_friends</code>. Going Live for other people needs App Review for <code>user_friends</code>.</li></ol></details>
 <details><summary>What the API can and cannot do</summary><ul>
 <li><code>/me/friends</code> returns only friends who also logged in to this same app. It is not your full friend list.</li>
 <li>No API exposes last active time, online status or login times. Activity here comes only from files you import.</li>
 <li>No API can unfriend anyone, so cleanup is a guided manual flow on facebook.com.</li></ul></details>
 <details><summary>Testing</summary><ol><li>Host over HTTPS (GitHub Pages) or run <code>python3 -m http.server 8000</code> and register <code>http://localhost:8000/</code>.</li><li>Click Continue with Facebook, approve, and check the profile shows on the dashboard.</li><li>Import a CSV with <code>Name,last_interaction</code> and check badges, filters and export.</li></ol></details></div>`;
}
function view(){
 switch(S.page){case"dashboard":return dashView();case"keep":return keepView();case"io":return ioView();case"settings":return settingsView();default:return listPage(S.page)}
}
function render(){
 theme();const app=$("#app");
 if(S.loading){app.innerHTML=`<div class="login"><div><div class="spin"></div><p style="text-align:center">Loading from Facebook&hellip;</p></div></div>`;return}
 if(S.page==="login"){app.innerHTML=loginView();return}
 const nav=(a,cls)=>a.map(([id,l,i])=>`<button class="${cls} ${S.page===id?"on":""}" data-act="nav" data-id="${id}">${ic(i)}${cls==="nv"?l:`<span>${l.split(" ")[0]}</span>`}</button>`).join("");
 const B=["dashboard","all","ranking","keep","cleanup"].map(id=>PAGES.find(p=>p[0]===id));
 app.innerHTML=`<div class="app"><aside class="side"><div class="logo"><b>f</b>Friend Manager</div>${nav(PAGES,"nv")}<div class="sp"></div><button class="nv" data-act="theme">${ic("moon")}Toggle theme</button></aside><main class="main">${view()}</main></div><nav class="bnav">${nav(B,"")}<button data-act="more">${ic("more")}<span>More</span></button></nav>`;
 paintList();paintKeep();
}

/* ---------- Actions ---------- */
const ACT={
 nav:id=>{closeModal();go(id)},connect:connect,sync:sync,
 guest:()=>{S.guest=true;go("io")},
 theme:()=>{S.prefs.theme=document.documentElement.dataset.theme==="dark"?"light":"dark";save();render()},
 more:()=>modal("More",["active","io","settings"].map(id=>{const p=PAGES.find(x=>x[0]===id);return `<button class="nv" data-act="nav" data-id="${id}">${ic(p[2])}${p[1]}</button>`}).join("")),
 mclose:closeModal,mok:()=>{const cb=S.mcb;closeModal();cb&&cb()},
 pick:()=>$("#file").click(),
 selAll:()=>{S.vis.forEach(id=>S.sel.add(id));paintList()},
 selNone:()=>{S.sel.clear();paintList()},
 keepSel:()=>{const n=S.sel.size;if(!n)return toast("Select friends first.",true);S.sel.forEach(id=>S.prot.add(id));S.sel.clear();save();toast(n+" friends added to your protected list.");paintList()},
 toClean:()=>{const n=[...S.sel].filter(id=>!S.prot.has(id));const skip=S.sel.size-n.length;if(!n.length)return toast("Select friends who are not protected.",true);S.sel=new Set(n);if(skip)toast(skip+" protected friends were left out.");go("cleanup")},
 keep:id=>{S.prot.add(id);S.sel.delete(id);save();toast("Added to protected list.");render()},
 unkeep:id=>{S.prot.delete(id);save();toast("Removed from protected list.");render()},
 review:()=>{
  const ids=[...S.sel].filter(id=>byId(id)&&!S.prot.has(id));if(!ids.length)return toast("Select at least one friend to review.",true);
  modal(`Review ${ids.length} friends`,`<p>Nothing is removed automatically. Confirming starts a guided list where you unfriend each person yourself on Facebook.</p><ol>${ids.map(id=>`<li>${esc(byId(id).name)}</li>`).join("")}</ol>`,"Start guided removal",()=>{S.queue=ids;S.sel.clear();save();toast("Guided removal ready.");render()},"bad");
 },
 done:id=>{S.friends=S.friends.filter(f=>f.id!==id);S.queue=S.queue.filter(x=>x!==id);S.sel.delete(id);S.prot.delete(id);save();toast("Marked as removed.");render()},
 cancelQ:()=>{S.queue=[];save();toast("Guide cancelled. No friends were changed.");render()},
 expAll:()=>exportCSV(S.friends,"friends.csv"),
 expSel:()=>exportCSV(S.friends.filter(f=>S.sel.has(f.id)),"selected-friends.csv"),
 expProt:()=>exportCSV(S.friends.filter(f=>S.prot.has(f.id)),"protected-friends.csv"),
 logout:()=>logout(),
 wipe:()=>modal("Erase local data?","<p>This clears imported friends, protected list and preferences stored in this browser. It does not affect your Facebook account.</p>","Erase",()=>{["fm.friends","fm.prot","fm.queue","fm.prefs"].forEach(k=>localStorage.removeItem(k));try{sessionStorage.clear()}catch{}location.reload()},"bad")
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;if(t.tagName==="A"&&t.dataset.act==="guest")e.preventDefault();ACT[t.dataset.act]?.(t.dataset.id)});
document.addEventListener("change",e=>{const t=e.target;
 if(t.classList.contains("chk")){t.checked?S.sel.add(t.dataset.id):S.sel.delete(t.dataset.id);count()}
 else if(t.id==="status"){S.prefs.status=t.value;save();paintList()}
 else if(t.id==="sort"){S.prefs.sort=t.value;save();paintList()}
 else if(t.id==="themeSel"){S.prefs.theme=t.value;save();render()}
 else if(t.id==="appId"){S.prefs.appId=t.value.trim();save();toast("App ID saved.")}
 else if(t.id==="file"&&t.files[0]){const f=t.files[0];if(f.size>20e6)return toast("File is larger than 20 MB.",true);const r=new FileReader();r.onload=()=>importText(r.result,f.name);r.onerror=()=>toast("Could not read that file.",true);r.readAsText(f);t.value=""}
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="q"){S.prefs.q=t.value;save();paintList()}else if(t.id==="kq"){S.kq=t.value;paintKeep()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",theme);

/* ---------- Boot ---------- */
(async function(){
 theme();
 const cb=handleCallback();
 if(cb==="ok"||tok()){await sync();return}
 S.page=S.friends.length?"dashboard":"login";render();
})();
</script>
</body>
</html>
